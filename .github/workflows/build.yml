name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.1"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Godot and export templates
        run: .github/scripts/install-godot.sh

      - name: Import project
        run: godot --headless --import

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Godot and export templates
        run: .github/scripts/install-godot.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner image already ships the Android SDK
      # (ANDROID_SDK_ROOT), so we only point Godot at it.
      - name: Point Godot at the Android SDK and create a debug keystore
        run: |
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.6.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_SDK_ROOT" "$JAVA_HOME" > "$HOME/.config/godot/$f"
          done
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        run: godot --headless --import

      - name: Export Android (debug APK)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/warring-hands.apk
          test -f build/android/warring-hands.apk

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: build/android/warring-hands.apk

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
