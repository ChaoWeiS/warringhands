[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, assets/music/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Warring Hands\">"
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=0
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/icon.png"
progressive_web_app/icon_180x180="res://assets/icon.png"
progressive_web_app/icon_512x512="res://assets/icon.png"
progressive_web_app/background_color=Color(0.788, 0.91, 0.729, 1)

[preset.1]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/android/warring-hands.apk"

[preset.1.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.chaoweis.warringhands"
package/name="Warring Hands"
screen/immersive_mode=true

